# Euchel — catálogo cliente (Fase 1). Sitio estático: sin base de datos.

[build]
  command = "python3 sitio/generar.py --salida dist"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"

# El CDN de imágenes convierte los WebP a JPEG al vuelo para las vistas
# previas de WhatsApp, que leen mal el WebP. Ver brand/pedido-whatsapp.md.

[[headers]]
  for = "/img/webp/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/estilos.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Las URLs viejas de la tienda siguen funcionando: producto.php?id=N -> ficha.
# Netlify no enruta por query string, así que esto lo resuelve la 404 con JS
# solo si hiciera falta; por ahora queda documentado y sin redirección activa.
